baseURL: "https://codidados.com.br/"
title: "CodiDados Soluções | ERP Protheus, PostgreSQL e Automação"
languageCode: "pt-BR"
defaultContentLanguage: "pt-br"
enableRobotsTXT: true
disableKinds:
  - RSS
  - taxonomy
  - term

build:
  buildStats:
    enable: true
  cachebusters:
    - source: "assets/notwatching/hugo_stats\\.json"
      target: "css"
    - source: "(postcss|tailwind)\\.config\\.js"
      target: "css"

module:
  hugoVersion:
    min: "0.147.8"
  mounts:
    - source: "hugo_stats.json"
      target: "assets/notwatching/hugo_stats.json"
      disableWatch: true
    - source: "assets"
      target: "assets"

params:
  description: "Consultoria especializada em ERP Protheus, PostgreSQL, integrações, automação e soluções para processos empresariais."
  author: "CodiDados Soluções"
  images:
    - "images/codidados-social.png"
  colors:
    primary: "#064a91"
    secondary: "#f0c400"
    text: "#263548"

markup:
  goldmark:
    renderer:
      unsafe: false

minify:
  minifyOutput: true
