title: "Conhecimento aplicado"
intro: "Projetos públicos que transformam estudo e experiência técnica em ambientes reproduzíveis, documentação e práticas verificáveis."
items:
  - title: "PostgreSQL Reliability Lab"
    eyebrow: "PostgreSQL · Database Reliability"
    description: "Laboratório de confiabilidade em PostgreSQL com Docker Compose, inicialização de bancos, backup, restauração e recuperação para um ponto no tempo (PITR)."
    github: "https://github.com/dirleiflsilva/postgresql-reliability-lab"
    article: "https://dfls.eti.br/projects/postgresql-reliability-lab/"
  - title: "Protheus Docker Lab"
    eyebrow: "Protheus · Docker · DevOps"
    description: "Laboratório Protheus com Docker Compose, PostgreSQL, DBAccess, AppServer e License Server, com configuração automatizada e validação operacional do ambiente."
    github: "https://github.com/dirleiflsilva/protheus-docker-lab"
    article: "https://dfls.eti.br/projects/protheus-docker-lab/"
  - title: "Protheus OpenAPI"
    eyebrow: "Protheus · TL++ · AdvPL · OpenAPI"
    description: "Projeto experimental e independente para gerar especificações OpenAPI de APIs REST do Protheus, explorando documentação, validação e testes em TL++ e AdvPL."
    github: "https://github.com/dirleiflsilva/protheus-openapi"
    article: "https://dfls.eti.br/projects/protheus-openapi/"
