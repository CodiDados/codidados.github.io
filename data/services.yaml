title: "Como podemos ajudar"
intro: "Soluções técnicas construídas de acordo com o ambiente, os processos e as prioridades de cada cliente."
items:
  - title: "ERP Protheus"
    icon: "code"
    description: "Desenvolvimento, manutenção e evolução de soluções no ERP TOTVS Protheus, com atuação em AdvPL, TL++, integrações e customizações."
    points:
      - "AdvPL e TL++"
      - "Customizações e integrações"
      - "Análise e melhoria de processos"
      - "Apoio técnico especializado"
  - title: "PostgreSQL e SQL"
    icon: "database"
    description: "Soluções em bancos de dados com foco em modelagem, SQL, automação, desempenho, integração e confiabilidade."
    points:
      - "Modelagem e desenvolvimento SQL"
      - "Otimização de consultas"
      - "Automação de rotinas"
      - "Migração e integração de dados"
  - title: "Integrações e automação"
    icon: "integration"
    description: "Automação de processos e integração entre sistemas utilizando APIs, Python, SQL e tecnologias adequadas a cada cenário."
    points:
      - "APIs e integração entre sistemas"
      - "Automação com Python"
      - "Cargas e sincronização de dados"
      - "Processamento de arquivos e documentos"
  - title: "Consultoria técnica"
    icon: "consulting"
    description: "Análise de ambientes, diagnóstico de problemas e definição de soluções sustentáveis, documentadas e adequadas à realidade do cliente."
    points:
      - "Diagnóstico e arquitetura"
      - "Modernização de processos"
      - "Documentação"
      - "Apoio a equipes"
